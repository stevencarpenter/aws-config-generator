[project]
name = "aws-config-gen"
dynamic = ["version"]
description = "Auto-generate AWS SSO profiles from Identity Center."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aws-config-gen = "aws_config_gen.cli:cli"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Keep lint/format rules aligned with the lowest supported interpreter so
# Ruff doesn't suggest syntax newer interpreters only.
[tool.ruff]
target-version = "py310"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version is derived from git tags (e.g. `v0.1.0` -> `0.1.0`); no version
# string is committed. Commits after a tag get a PEP 440 dev version.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_config_gen"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE"]
